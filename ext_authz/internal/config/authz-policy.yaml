version: "1"
default_action: "allow"

rules:

  # ─── Public — no JWT required, no conditions ──────────────────────────
  - name: public-access
    match:
      path_prefix: "/api/public"

  # ─── JWT required — just needs any valid subject ─────────────────────
  - name: profile-access
    match:
      path_prefix: "/api/profile"
    conditions:
      constraint:
        fact: token.sub
        operator: exists

  - name: protected-api
    match:
      path_prefix: "/api/protected"
    conditions:
      constraint:
        all:
          - fact: token.sub
            operator: exists
          - fact: token.realm_access.roles
            operator: contains
            value: protected-reader

  # ─── User data — weekday only (weekend needs break-glass) ────────────
  - name: user-data-weekday
    match:
      path_prefix: "/api/user-data"
    conditions:
      constraint:
        all:
          - fact: token.realm_access.roles
            operator: contains
            value: user
          - not:
              fact: request.time.day_of_week
              operator: in
              value: [0, 6]


  # ─── Admin data — admin role + business hours (7–22) ─────────────────
  - name: admin-business-hours
    match:
      path_prefix: "/api/admin-data"
    conditions:
      required_scopes:
        - "email"
      constraint:
        all:
          - fact: token.realm_access.roles
            operator: contains
            value: admin
          - fact: request.time.hour
            operator: between
            value: [7, 22]
          - fact: token.email
            operator: exists

