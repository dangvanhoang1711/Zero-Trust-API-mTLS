version: "1"
default_action: "allow"

rules:

  # ─── Public — no JWT required, no conditions ──────────────────────────
  - name: public-access
    match:
      path_prefix: "/api/public"

  # ─── JWT required — just needs any valid subject ─────────────────────
  - name: profile-access
    match:
      path_prefix: "/api/profile"
    conditions:
      constraint:
        fact: token.sub
        operator: exists

  - name: jwt-info-access
    match:
      path_prefix: "/api/jwt-info"
    conditions:
      constraint:
        fact: token.sub
        operator: exists

  - name: protected-api
    match:
      path_prefix: "/protected"
    conditions:
      constraint:
        fact: token.sub
        operator: exists

  # ─── User data — weekday only (weekend needs break-glass) ────────────
  - name: user-data-weekday
    match:
      path_prefix: "/api/user-data"
    conditions:
      constraint:
        all:
          - fact: token.realm_access.roles
            operator: contains
            value: user
          - not:
              fact: request.time.day_of_week
              operator: in
              value: [0, 6]

  # ─── User data weekend break-glass — cert subject match ──────────────
  - name: user-data-break-glass
    match:
      path_prefix: "/api/user-data"
    conditions:
      constraint:
        all:
          - fact: cert.subject
            operator: matches
            value: ".*demo-client.*"
          - fact: request.time.day_of_week
            operator: in
            value: [0, 6]

  # ─── Admin data — admin role + business hours (7–22) ─────────────────
  - name: admin-business-hours
    match:
      path_prefix: "/api/admin-data"
    conditions:
      required_scopes:
        - "email"
      constraint:
        all:
          - fact: token.realm_access.roles
            operator: contains
            value: admin
          - fact: request.time.hour
            operator: between
            value: [7, 22]
          - fact: token.email
            operator: exists

  # ─── Deny rules (no conditions, always block) ────────────────────────
  - name: deny-admin
    match:
      path_prefix: "/admin"
    action: "deny"

  - name: deny-secrets
    match:
      path_prefix: "/secrets"
    action: "deny"
