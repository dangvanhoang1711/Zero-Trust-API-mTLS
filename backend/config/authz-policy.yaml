version: "1"
default_action: "deny"

rules:

  # ─── Public — no JWT required, no conditions ──────────────────────────
  - name: public-access
    action: allow
    match:
      path_prefix: "/api/public"

  # ─── Auth — login/register endpoints, no JWT required ─────────────────
  - name: auth-endpoints
    action: allow
    match:
      path_prefix: "/api/auth"

  # ─── JWT required — just needs any valid subject ─────────────────────
  - name: profile-access
    action: allow
    match:
      path_prefix: "/api/profile"
    conditions:
      constraint:
        fact: token.sub
        operator: exists

  - name: abac-policies-access
    action: allow
    match:
      path_prefix: "/api/abac"
    conditions:
      constraint:
        fact: token.sub
        operator: exists

  - name: protected-api
    action: allow
    match:
      path_prefix: "/api/protected"
    conditions:
      constraint:
        all:
          - fact: token.sub
            operator: exists
          - fact: token.realm_access.roles
            operator: contains
            value: protected-reader

  # ─── User data — weekday only (weekend needs break-glass) ────────────
  - name: user-data-weekday
    action: allow
    match:
      path_prefix: "/api/user-data"
    conditions:
      constraint:
        all:
          - fact: token.realm_access.roles
            operator: contains
            value: user
          - not:
              fact: request.time.day_of_week
              operator: in
              value: [0, 6]


  # ─── Director data — director role + business hours (7–22) ─────────────────
  - name: director-business-hours
    action: allow
    match:
      path_prefix: "/api/director-data"
    conditions:
      required_scopes:
        - "email"
      constraint:
        all:
          - fact: token.realm_access.roles
            operator: contains
            value: director
          - fact: request.time.hour
            operator: between
            value: [7, 22]
          - fact: token.email
            operator: exists

