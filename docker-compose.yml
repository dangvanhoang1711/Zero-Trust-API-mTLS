name: zero-trust-mvp

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_DB: "dev-file"
      KC_HOSTNAME: "http://keycloak:8080"
      KC_CACHE: "local"
      JAVA_OPTS_APPEND: >-
        -Xms64m -Xmx256m
        -XX:MaxMetaspaceSize=192m
    volumes:
      - ./project_root/infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master/ HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ext_authz:
    build:
      context: ./project_root/ext_authz
    depends_on:
      keycloak:
        condition: service_healthy
      replay-cache:
        condition: service_started
    environment:
      PORT: "50051"
      JWT_ISSUER: "http://keycloak:8080/realms/zero-trust"
      JWT_AUDIENCE: "api-gateway"
      JWKS_REFRESH_INTERVAL: "5m"
      REPLAY_TTL: "10m"
      REQUIRED_SCOPE: "${REQUIRED_SCOPE:-}"
      REQUIRED_SCOPES: "${REQUIRED_SCOPES:-}"
      AUTHZ_POLICY_FILE: "/etc/ext-authz/config/authz-policy.yaml"
      REPLAY_BACKEND: "${REPLAY_BACKEND:-memory}"
      REPLAY_REDIS_URL: "${REPLAY_REDIS_URL:-redis://replay-cache:6379/0}"
      REPLAY_REDIS_KEY_PREFIX: "${REPLAY_REDIS_KEY_PREFIX:-zero-trust:replay}"
      CLIENT_CA_BUNDLE: "/etc/ca-bundle/ca-chain.crt"
      DPoP_REQUIRE_NONCE: "false"
      DPoP_MAX_AGE: "2m"
      DPoP_CLOCK_SKEW: "2s"
      DPoP_NONCE_TTL: "5m"
      DPoP_PROOF_TTL: "5m"
      DPoP_PROOF_MAX_ENTRIES: "100000"
      CRL_DISTRIBUTION_URL: "http://vault:8200/v1/pki-int/crl"
      CRL_REFRESH_INTERVAL: "15m"
      VAULT_TOKEN: "root"
    volumes:
      - ./project_root/infra/certs/ca-chain.crt:/etc/ca-bundle/ca-chain.crt:ro
      - ./project_root/ext_authz/config:/etc/ext-authz/config:ro
    expose:
      - "50051"
    restart: unless-stopped

  replay-cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./project_root/infra/services/echo
    expose:
      - "8080"
    restart: unless-stopped

  protected-api:
    build:
      context: ./project_root/infra/services/protected-api
    expose:
      - "8080"
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    command:
      - "envoy"
      - "-c"
      - "/etc/envoy/envoy.yaml"
      - "--log-level"
      - "warning"
    volumes:
      - ./project_root/envoy_config/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./project_root/envoy_config/tls:/etc/envoy/tls:ro
    ports:
      - "10001:10001"
      - "10000:10000"
    depends_on:
      - ext_authz
      - backend
      - protected-api
    restart: unless-stopped

  dpop-token-proxy:
    build:
      context: ./project_root/dpop-token-proxy
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "5002:5002"
    environment:
      KEYCLOAK_URL: "http://keycloak:8080"
      PROXY_URL: "http://dpop-token-proxy:5002"
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      DPOP_MAX_AGE_SECONDS: "120"
      DPOP_CLOCK_SKEW_SECONDS: "5"
    restart: unless-stopped

  dashboard:
    build:
      context: ./project_root/dashboard
    depends_on:
      keycloak:
        condition: service_healthy
      envoy:
        condition: service_started
      dpop-token-proxy:
        condition: service_started
    ports:
      - "5000:5000"
    volumes:
      - ./project_root/infra/certs:/app/../infra/certs:ro
    environment:
      KEYCLOAK_URL: "http://keycloak:8080"
      ENVOY_URL: "https://envoy:10000"
      DASHBOARD_PORT: "5000"
      DPOP_PROXY_URL: "http://dpop-token-proxy:5002"
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    command: ["vault", "server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200"]
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 5s
      retries: 5

  pki-init:
    image: hashicorp/vault:1.15
    depends_on:
      vault:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      KEYCLOAK_URL: http://keycloak:8080
    volumes:
      - ./project_root:/workspace/project_root
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    command: >
      sh -c "
      apk add --no-cache openssl python3 py3-pip curl bash docker-cli 2>&1 | tail -1 &&
      pip3 install --no-cache-dir requests -q &&
      echo '>>> Initializing PKI...' &&
      bash /workspace/project_root/infra/vault/gen-pki-vault.sh &&
      echo '>>> Restarting services to pick up new certs...' &&
      docker restart zero-trust-mvp-envoy-1 2>/dev/null || echo '  (envoy will start fresh with new certs)' &&
      docker restart zero-trust-mvp-ext_authz-1 2>/dev/null || echo '  (ext_authz will start fresh with new certs)' &&
      echo '>>> PKI initialization complete - system ready for demo'
      "
    restart: "no"
