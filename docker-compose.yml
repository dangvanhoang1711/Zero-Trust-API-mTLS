services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      KC_HTTP_RELATIVE_PATH: "/"
      KC_HOSTNAME: "keycloak"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master/ HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  vault:
    image: hashicorp/vault:1.15
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN_ID:-root}"
      VAULT_ADDR: "http://127.0.0.1:8200"
    entrypoint: vault server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  pki-init:
    image: hashicorp/vault:1.15
    depends_on:
      vault:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - .:/workspace
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_DEV_ROOT_TOKEN_ID:-root}"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_ADMIN: "${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache openssl python3 py3-pip curl bash > /dev/null 2>&1 &&
        pip3 install --no-cache-dir requests -q > /dev/null 2>&1 &&
        sleep 5 &&
        chmod +x /workspace/vault/scripts/gen-pki-vault.sh &&
        cd /workspace &&
        /workspace/vault/scripts/gen-pki-vault.sh
      "

  ext-authz:
    build: ./ext_authz
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
    volumes:
      - ./ext_authz/internal/config:/etc/ext-authz/config:ro
      - ./envoy/certs:/etc/internal-tls:ro
    environment:
      PORT: "50051"
      JWT_ISSUER: "http://keycloak:8080/realms/zero-trust"
      JWT_AUDIENCE: "api-gateway"
      JWKS_URL: "http://keycloak:8080/realms/zero-trust/protocol/openid-connect/certs"
      AUTHZ_POLICY_FILE: "/etc/ext-authz/config/authz-policy.yaml"
      REPLAY_BACKEND: "redis"
      REPLAY_REDIS_URL: "redis://redis:6379/0"
      REPLAY_REDIS_KEY_PREFIX: "zero-trust:replay"
      VAULT_TOKEN: "${VAULT_DEV_ROOT_TOKEN_ID:-root}"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      SECRET_KEY: "${SECRET_KEY:-dev-secret-change-me}"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "zero-trust"
      KEYCLOAK_CLIENT_ID: "web-app"
      KEYCLOAK_CLIENT_SECRET: ""
      JWT_ISSUER: "http://keycloak:8080/realms/zero-trust"
      JWT_AUDIENCE: "api-gateway"

  protected-api:
    build: ./backend/legacy-services/protected-api
    depends_on:
      pki-init:
        condition: service_completed_successfully
    volumes:
      - ./envoy/certs:/etc/internal-tls:ro
    environment:
      PORT: "8080"

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    depends_on:
      ext-authz:
        condition: service_started
      backend:
        condition: service_started
      protected-api:
        condition: service_started
      pki-init:
        condition: service_completed_successfully
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
      - "18080:18080"
      - "9901:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/certs:/etc/envoy/tls:ro
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --log-level info
