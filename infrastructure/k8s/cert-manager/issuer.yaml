apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-vault-issuer
  namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-vault-tokenrequest
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["cert-manager-vault-issuer"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-vault-tokenrequest
  namespace: cert-manager
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-vault-tokenrequest
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-server-clusterissuer
spec:
  vault:
    server: https://vault.default.svc.cluster.local:8200
    path: pki-int/sign/server-cert
    caBundleSecretRef:
      name: vault-ca-bundle
      key: ca.crt
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-issuer
        serviceAccountRef:
          name: cert-manager-vault-issuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-client-clusterissuer
spec:
  vault:
    server: https://vault.default.svc.cluster.local:8200
    path: pki-int/sign/client-cert
    caBundleSecretRef:
      name: vault-ca-bundle
      key: ca.crt
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-issuer
        serviceAccountRef:
          name: cert-manager-vault-issuer
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca-bundle
  namespace: cert-manager
type: Opaque
stringData:
  ca.crt: |
    REPLACE_WITH_VAULT_SERVER_CA_CERT
