include:
  - docker-compose.service.yml

services:
  frontend:
    build: ../../frontend
    ports:
      - "3001:443"
    environment:
      VITE_API_BASE_URL: ""
    volumes:
      - ../../envoy/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - service-net

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    ports:
      - "443:10000"
      - "10001:10001"
      - "9901:9901"
    volumes:
      - ../../envoy/envoy.yaml:/etc/envoy/envoy.yaml
      - ../../envoy/certs:/etc/envoy/certs
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --log-level debug
    depends_on:
      backend:
        condition: service_started
      ext-authz:
        condition: service_started
      pki-init:
        condition: service_completed_successfully
    networks:
      - service-net
