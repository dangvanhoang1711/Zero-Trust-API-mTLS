services:
  frontend:
    build: ../../frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: ""
    depends_on:
      - backend
    networks:
      - public-net

  backend:
    build: ../../backend
    ports:
      - "8443:8443"
    volumes:
      - ../../envoy/certs:/certs
    environment:
      KEYCLOAK_URL: "${KEYCLOAK_URL:-https://keycloak:8443}"
      KEYCLOAK_REALM: "zero-trust"
      KEYCLOAK_CLIENT_ID: "api-gateway"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-}"
      SECRET_KEY: "${SECRET_KEY:-dev-secret-change-me}"
      REQUESTS_CA_BUNDLE: "/certs/ca-chain.crt"
    depends_on:
      - envoy
    networks:
      - public-net

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    ports:
      - "443:10000"
      - "80:10001"
    volumes:
      - ../../envoy/envoy.yaml:/etc/envoy/envoy.yaml
      - ../../envoy/certs:/etc/envoy/certs
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --log-level debug
    networks:
      - public-net

networks:
  public-net:
    driver: bridge
