services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      KC_HTTP_RELATIVE_PATH: "/"
      KC_HOSTNAME: "${KEYCLOAK_HOSTNAME:-keycloak}"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTPS_CERTIFICATE_FILE: "/certs/tls.crt"
      KC_HTTPS_CERTIFICATE_KEY_FILE: "/certs/tls.key"
      JAVA_OPTS: "-Xms64m -Xmx256m -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=128m"
    volumes:
      - ../../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ../../envoy/certs:/certs
    command: start-dev --import-realm --https-port=8443
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      pki-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - service-net

  vault-tls-init:
    build:
      context: ../../
      dockerfile: infrastructure/docker/images/vault-init/Dockerfile
    volumes:
      - ../../envoy/certs:/certs
      - ../vault/vault.hcl:/vault-config/vault.hcl:ro
    entrypoint: ["/usr/local/bin/vault-tls-init.sh"]
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - service-net

  vault:
    image: hashicorp/vault:1.15
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ../../envoy/certs:/certs
      - vault-data:/vault/data
      - ../vault/vault.hcl:/vault.hcl:ro
    environment:
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/certs/vault-ca.crt"
    entrypoint: vault server -config=/vault.hcl
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_SKIP_VERIFY=true vault status > /dev/null 2>&1; exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      vault-tls-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - service-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - service-net

  backend:
    build: ../../backend
    ports:
      - "5000:8443"
    volumes:
      - ../../envoy/certs:/certs
    environment:
      KEYCLOAK_URL: "https://keycloak:8443"
      KEYCLOAK_REALM: "zero-trust"
      KEYCLOAK_CLIENT_ID: "web-app"
      KEYCLOAK_CLIENT_SECRET: ""
      JWT_ISSUER: "https://keycloak:8443/realms/zero-trust"
      JWT_AUDIENCE: "api-gateway"
      KEYCLOAK_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      SECRET_KEY: "${SECRET_KEY:-dev-secret-change-me}"
      REQUESTS_CA_BUNDLE: "/certs/ca-chain.crt"
      FRONTEND_ORIGINS: "https://13.238.159.245,https://10.0.5.131"
    depends_on:
      keycloak:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - service-net

  ext-authz:
    build: ../../ext_authz
    ports:
      - "50051:50051"
    volumes:
      - ../../ext_authz/internal/config:/etc/ext-authz/config
      - ../../envoy/certs:/etc/ext-authz/certs
    environment:
      KEYCLOAK_URL: "https://keycloak:8443"
      KEYCLOAK_REALM: "zero-trust"
      JWT_ISSUER: "https://keycloak:8443/realms/zero-trust"
      JWT_AUDIENCE: "api-gateway"
      JWKS_URL: "https://keycloak:8443/realms/zero-trust/protocol/openid-connect/certs"
      REPLAY_REDIS_URL: "redis://redis:6379"
      AUTHZ_POLICY_FILE: "/etc/ext-authz/config/authz-policy.yaml"
      VAULT_ADDR: "https://vault:8200"
      VAULT_TOKEN: "${VAULT_DEV_ROOT_TOKEN_ID:-root}"
      LISTEN_ADDR: "0.0.0.0:50051"
      TLS_CERT_FILE: "/etc/ext-authz/certs/tls.crt"
      TLS_KEY_FILE: "/etc/ext-authz/certs/tls.key"
      SSL_CERT_FILE: "/etc/ext-authz/certs/ca-chain.crt"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - service-net

  pki-init:
    build:
      context: ../../
      dockerfile: infrastructure/docker/images/vault-init/Dockerfile
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ../../envoy/certs:/certs
      - ../../keycloak:/keycloak
    environment:
      VAULT_ADDR: "https://vault:8200"
      VAULT_TOKEN: "${VAULT_DEV_ROOT_TOKEN_ID:-root}"
      VAULT_CACERT: "/certs/vault-ca.crt"
      KEYCLOAK_URL: "https://keycloak:8443"
      KEYCLOAK_ADMIN: "${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      SERVER_CERT_DNS_NAMES: "${SERVER_CERT_DNS_NAMES:-localhost,envoy,backend,protected-api,ext-authz,keycloak}"
      SERVER_CERT_IP_SANS: "${SERVER_CERT_IP_SANS:-127.0.0.1,10.0.2.27,10.0.5.131}"
      SERVER_CERT_EXTRA_IP_SANS: "${SERVER_CERT_EXTRA_IP_SANS:-13.238.159.245,3.106.196.141}"
    entrypoint: ["/usr/local/bin/pki-init.sh"]
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - service-net

volumes:
  vault-data:

networks:
  service-net:
    driver: bridge
