services:
  frontend:
    build: ../../frontend
    ports:
      - "80:80"
    environment:
      VITE_API_BASE_URL: ""
    volumes:
      - ../../envoy/certs:/etc/nginx/certs:ro
      - ../../frontend/nginx.ec2.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - envoy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - envoy-net

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    ports:
      - "443:10000"
      - "10001:10001"
      - "127.0.0.1:9901:9901"
    volumes:
      - ../../envoy/envoy.ec2.yaml:/etc/envoy/envoy.yaml
      - ../../envoy/certs:/etc/envoy/certs
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --log-level info
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - envoy-net

networks:
  envoy-net:
    driver: bridge
