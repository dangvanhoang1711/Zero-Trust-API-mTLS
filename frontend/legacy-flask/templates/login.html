{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div style="max-width:400px;margin:60px auto;">
  <div class="card">
    <h3 style="font-size:24px;text-align:center;margin-bottom:20px;">Đăng nhập</h3>
    <form method="POST">
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:6px;">Tên đăng nhập</label>
        <input type="text" name="username" required
          style="width:100%;padding:12px 14px;background:rgba(8,12,24,0.6);border:1px solid rgba(51,65,85,0.4);
          border-radius:10px;color:#e2e8f0;font-size:15px;outline:none;"
          placeholder="admin hoặc demo-user">
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:6px;">Mật khẩu</label>
        <input type="password" name="password" required
          style="width:100%;padding:12px 14px;background:rgba(8,12,24,0.6);border:1px solid rgba(51,65,85,0.4);
          border-radius:10px;color:#e2e8f0;font-size:15px;outline:none;"
          placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Đăng nhập</button>
    </form>
    <div style="text-align:center;margin-top:16px;font-size:14px;color:#64748b;">
      Chưa có tài khoản? <a href="{{ url_for('register') }}" style="color:#60a5fa;text-decoration:none;">Đăng ký</a>
    </div>
    <div style="margin-top:20px;padding:16px;background:rgba(8,12,24,0.4);border-radius:10px;font-size:13px;color:#64748b;">
      <strong style="color:#94a3b8;">Tài khoản demo:</strong><br>
      👤 <code>admin</code> / <code>admin</code> — quyền admin<br>
      👤 <code>demo-user</code> / <code>demo-pass</code> — quyền user
    </div>
  </div>
</div>
{% endblock %}
