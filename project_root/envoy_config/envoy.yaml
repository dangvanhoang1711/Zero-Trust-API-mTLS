static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address: { address: 0.0.0.0, port_value: 10000 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: target_service }
          http_filters:
          # --- BƯỚC 1: GỬI SANG PYTHON (PDP) ĐỂ CHECK ---
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              http_service:
                server_uri:
                  uri: http://ext_authz_service:5000/auth
                  cluster: ext-authz-cluster
                  timeout: 0.25s
                authorization_request:  
                  allowed_headers:
                    patterns:
                    - exact: "authorization" 
                path_ext_authz: true 
          # --- BƯỚC 2: NẾU PYTHON OK THÌ MỚI CHO ĐI TIẾP ---
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # Định nghĩa App mục tiêu (Data Plane)
  - name: target_service
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: target_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: resource_server, port_value: 80 }

  # Định nghĩa ông Thẩm định viên (Control Plane - PDP)
  - name: ext-authz-cluster
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: ext-authz-cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: ext_authz_service, port_value: 5000 }