apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.30.10
        ports:
          - containerPort: 10000
          - containerPort: 9901
        command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]
        volumeMounts:
          - name: config-volume
            mountPath: /etc/envoy/envoy.yaml
            subPath: envoy.yaml
          - name: envoy-cert-volume
            mountPath: /etc/envoy/tls
            readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: envoy-config
        - name: envoy-cert-volume
          secret:
            secretName: envoy-server-tls
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-service
spec:
  selector:
    app: envoy
  ports:
    - protocol: TCP
      port: 10000
      targetPort: 10000
  type: ClusterIP
