version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - zero-trust-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: keycloak_server
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy # Chỉ chạy Keycloak khi Postgres đã sẵn sàng
    networks:
      - zero-trust-network

  ext-authz:
    build: 
      context: ../ext_authz  # Đường dẫn tới thư mục chứa Dockerfile Python
    container_name: ext_authz_service
    ports:
      - "5001:5000" # Port 5001 để bạn test thử từ ngoài, 5000 để Envoy gọi nội bộ
    environment:
      - TZ=Asia/Ho_Chi_Minh  # <--- Thêm dòng này để ép dùng giờ VN
      - PYTHONUNBUFFERED=1
    volumes:
      - /etc/localtime:/etc/localtime:ro # (Tùy chọn) Đồng bộ file giờ của máy chủ
    networks:
      - zero-trust-network
    depends_on:
      - keycloak

  envoy-gateway:
    image: envoyproxy/envoy:v1.25-latest
    container_name: envoy_gateway
    volumes:
      # Chú ý: ../ để nhảy ra khỏi thư mục infra, tìm đến thư mục envoy_config cùng cấp
      - ../envoy_config/envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - "80:10000" # User truy cập qua cổng 80 (HTTP chuẩn)
    networks:
      - zero-trust-network
    depends_on:
      - ext-authz

  target-app:
    image: nginxdemos/hello # Đây là một App giả lập trả về giao diện chào mừng
    container_name: resource_server
    networks:
      - zero-trust-network

networks:
  zero-trust-network:
    driver: bridge

volumes:
  postgres_data: