version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - zero-trust-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    container_name: keycloak_server
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy # Chỉ chạy Keycloak khi Postgres đã sẵn sàng
    networks:
      - zero-trust-network

  ext-authz:
    build: 
      context: ../ext_authz
    container_name: ext-authz-service
    ports:
      - "5001:5000" # Port 5001 để bạn test thử từ ngoài, 5000 để Envoy gọi nội bộ
    environment:
      - TZ=Asia/Ho_Chi_Minh  # <--- Thêm dòng này để ép dùng giờ VN
      - FORCE_ALLOW_FOR_DEMO=false
    volumes:
      - /etc/localtime:/etc/localtime:ro # (Tùy chọn) Đồng bộ file giờ của máy chủ
    networks:
      - zero-trust-network
    depends_on:
      - keycloak

  envoy-gateway:
    image: envoyproxy/envoy:v1.25-latest
    container_name: envoy-gateway
    volumes:
      - ../envoy_config:/etc/envoy
    ports:
      - "10000:10000"
    networks:
      - zero-trust-network
    depends_on:
      - ext-authz

  target-app:
    image: nginxdemos/hello # Đây là một App giả lập trả về giao diện chào mừng
    container_name: resource-server
    networks:
      - zero-trust-network
  
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root" # Token để bạn đăng nhập
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK

networks:
  zero-trust-network:
    driver: bridge

volumes:
  postgres_data:
